[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "sftpmock"
version = "2.0.0"
authors = [{ name = "Bruno Werner" }]
description = "Mock SFTP server connections and contents for testing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing :: Mocking",
  "Typing :: Typed",
]
dependencies = [
  "paramiko>=3.4.1",
]

[project.urls]
Homepage = "https://github.com/Doctor-God/sftpmock"
Issues = "https://github.com/Doctor-God/sftpmock/issues"
Changelog = "https://github.com/Doctor-God/sftpmock/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]
